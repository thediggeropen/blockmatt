<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairy Einzelkern</title><body style="font:15px system-ui;padding:16px"><h3>Fairy Einzelkern-Test</h3><pre id="out">läuft …</pre>
<script>
const out = document.getElementById('out'), log = (s) => { out.textContent += '\n' + s; };
// alter Spike-Service-Worker (setzte COOP/COEP) darf hier nicht mitspielen: abmelden, einmal neu laden
if (navigator.serviceWorker?.controller && !sessionStorage.getItem('sw-weg')) {
  sessionStorage.setItem('sw-weg', '1');
  navigator.serviceWorker.getRegistrations().then((rs) => Promise.all(rs.map((r) => r.unregister()))).then(() => location.reload());
  throw new Error('alter Service Worker wird abgemeldet');
}
out.textContent = navigator.userAgent + '\n'
out.textContent += 'crossOriginIsolated: ' + self.crossOriginIsolated + ' · SharedArrayBuffer: ' + (typeof SharedArrayBuffer);
const INI = '[raumziel:chess]\nextinctionValue = loss\nextinctionPieceTypes = *\nextinctionPieceCount = 1\n';
const CASES = [['raumziel','P1','4k3/3n4/8/8/8/8/8/3QK3 w - - 0 1','d1d7'],['raumziel','P2','7k/8/1n6/8/Q7/1K6/7P/8 b - - 0 1','h8g8'],['chess','Start','rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',null]];
const t0 = performance.now(), w = new Worker('worker.js');
let wait = null, last = '';
w.onerror = (e) => { log('FEHLER: ' + e.message); log('ERGEBNIS: ROT'); window.__done = { error: e.message }; };
w.onmessage = (e) => { const l = e.data; if (/^info .*score/.test(l)) last = l; if (wait && wait.re.test(l)) { const x = wait; wait = null; x.ok(l); } };
const until = (re) => new Promise((ok) => { wait = { re, ok }; });
(async () => {
  await until(/^__ready/); log(`geladen: ${Math.round(performance.now() - t0)} ms`);
  w.postMessage({ ini: INI }); w.postMessage('uci'); await until(/^uciok/);
  w.postMessage('load /blockmatt.ini'); w.postMessage('isready'); await until(/^readyok/);
  const res = [];
  for (const [v, n, fen, want] of CASES) for (const d of [8, 12]) {
    w.postMessage(`setoption name UCI_Variant value ${v}`); w.postMessage(`position fen ${fen}`);
    const t = performance.now(); w.postMessage(`go depth ${d}`); const best = (await until(/^bestmove/)).split(' ')[1];
    const ms = Math.round(performance.now() - t), sc = (last.match(/score (\w+ -?\d+)/) || [])[1];
    const ok = want ? (best === want ? 'ok' : 'FALSCH') : '';
    log(`${v} ${n} Tiefe ${d}: ${best} (${sc}) ${ms} ms ${ok}`); res.push({ v, n, d, best, ms, ok });
  }
  const gruen = res.every((r) => r.ok !== 'FALSCH') && !self.crossOriginIsolated;
  log(gruen ? 'ERGEBNIS: GRÜN' : 'ERGEBNIS: ROT'); window.__done = res;
})();
</script>
